<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 LED Controller - Video Presentation & User Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0c10;
            --card-bg: #161c28;
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --accent-green: #00ff88;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .title-area h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .title-area p { font-size: 0.85rem; color: var(--text-muted); }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        /* Video Player Screen Simulator */
        .video-container {
            background: #000;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .screen-viewport {
            flex: 1;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            background: radial-gradient(circle at center, #1b2234 0%, #080a0e 100%);
            position: relative;
            overflow: hidden;
        }

        .scene-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 240, 255, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .scene-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
        }

        .scene-desc {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .scene-visual {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 550px;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .scene-visual code {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Player Control Bar */
        .video-controls {
            background: #0f131c;
            padding: 14px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            border-radius: 3px;
            transition: width 0.2s ease;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group { display: flex; gap: 8px; align-items: center; }

        .btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.12); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none; color: #fff; font-weight: 600;
        }

        /* Scene Sidebar List */
        .scene-list {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 540px;
        }

        .scene-item {
            padding: 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scene-item:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
        }

        .scene-item.active {
            background: rgba(0, 240, 255, 0.08);
            border-color: var(--accent-cyan);
        }

        .scene-item-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .scene-item-duration {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .narrator-box {
            margin-top: 15px;
            background: rgba(112, 0, 255, 0.08);
            border-left: 3px solid var(--accent-purple);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-area">
            <h1>ESP32 LED Matrix Controller - Interactive Video Guide</h1>
            <p>Step-by-Step Interactive Presentation for Code, Web App & Hardware Wiring</p>
        </div>
        <button class="btn btn-primary" onclick="window.print()">Print Script / PDF</button>
    </header>

    <div class="main-layout">
        <!-- Animated Screen Player -->
        <div class="video-container">
            <div class="screen-viewport" id="viewport">
                <div class="scene-badge" id="sceneBadge">Scene 1 / 6</div>
                <h2 class="scene-title" id="sceneTitle">Loading Presentation...</h2>
                <p class="scene-desc" id="sceneDesc"></p>
                <div class="scene-visual" id="sceneVisual"></div>
            </div>

            <!-- Controls -->
            <div class="video-controls">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="controls-row">
                    <div class="btn-group">
                        <button class="btn btn-primary" id="playBtn">Play Presentation</button>
                        <button class="btn" id="prevBtn">Previous Scene</button>
                        <button class="btn" id="nextBtn">Next Scene</button>
                    </div>
                    <div style="font-family:'JetBrains Mono', monospace; font-size:0.8rem; color:var(--text-muted);" id="timerDisplay">
                        00:00 / 02:30
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar Scene Navigation -->
        <div>
            <div class="scene-list" id="sceneList">
                <!-- Scenes generated dynamically -->
            </div>

            <div class="narrator-box">
                <strong style="color:var(--accent-purple); display:block; margin-bottom:4px;">🎙️ Presenter Script:</strong>
                <span id="narratorScript">Select a scene to view the narration script.</span>
            </div>
        </div>
    </div>

    <script>
        const scenes = [
            {
                id: 1,
                title: "1. Project Overview & Architecture",
                duration: "00:25",
                desc: "Introduction to the ESP32 LED Matrix Controller project, dynamic web interface, and FastLED parallel driving system.",
                script: "Hello! In this guide, we walk through the ESP32 LED Matrix Controller. This project allows you to stream and play high-speed RGB animation binary files (.bin) on WS2812B matrix displays using parallel data channels and a built-in web server.",
                visual: `
                    <div style="text-align:center;">
                        <h3 style="color:var(--accent-cyan); margin-bottom:8px;">System Components</h3>
                        <p>• <b>ESP32 Dev Board</b> (FastLED Parallel RMT Driving)</p>
                        <p>• <b>Web Server AP Mode</b> (Host IP: 192.168.4.1)</p>
                        <p>• <b>Chunked Binary File Uploader</b> (LittleFS Storage)</p>
                        <p>• <b>Smart Wiring Guide</b> (Dynamic Hardware Calculations)</p>
                    </div>
                `
            },
            {
                id: 2,
                title: "2. Firmware Code Structure (main.cpp)",
                duration: "00:35",
                desc: "Breakdown of the C++ firmware architecture in PlatformIO.",
                script: "Let's inspect main.cpp. The code is divided into three core sections: LittleFS filesystem mounting, FastLED parallel controller setup across safe GPIO pins (D2, D4, D5, D12), and the asynchronous HTTP WebServer listening on port 80.",
                visual: `
                    <p><b>Core Firmware Highlights in <code>src/main.cpp</code>:</b></p>
                    <p>1. <code>controllers[0..3]</code> map to pins <code>GPIO D2, D4, D5, D12</code>.</p>
                    <p>2. <code>applyParallelLayout(strips, leds)</code> dynamically calculates chunk sizes per pin.</p>
                    <p>3. <code>handleFileUpload()</code> handles chunked 256KB binary file writes to LittleFS flash.</p>
                `
            },
            {
                id: 3,
                title: "3. Connecting to the ESP32 Web Application",
                duration: "00:20",
                desc: "How to connect to the WiFi hotspot and open the Web App.",
                script: "Once powered on, the ESP32 creates its own Wi-Fi Access Point network named 'ESP32-LED-Controller'. Connect your smartphone or computer to this Wi-Fi network and open http://192.168.4.1 in any browser.",
                visual: `
                    <div style="background:rgba(0,240,255,0.05); padding:12px; border-radius:6px;">
                        <p><b>Wi-Fi SSID:</b> <code>ESP32-LED-Controller</code></p>
                        <p><b>Wi-Fi Password:</b> <code>12345678</code></p>
                        <p><b>Web Portal URL:</b> <code>http://192.168.4.1</code></p>
                    </div>
                `
            },
            {
                id: 4,
                title: "4. Using the Matrix Configuration Sliders",
                duration: "00:30",
                desc: "Adjusting Number of Strips and LEDs per Strip in real time.",
                script: "In the Web App, you can set the Number of LED Strips and LEDs per Strip using the sliders or number boxes. The interface instantly calculates total LED count, refresh rate (FPS), and max amperage demand.",
                visual: `
                    <p><b>Real-time Metrics Display:</b></p>
                    <p>• <b>Total LEDs:</b> Calculated as <code>Strips × LEDs per Strip</code>.</p>
                    <p>• <b>Max Power Demand:</b> Estimated at <code>60mA</code> per white pixel.</p>
                    <p>• <b>FPS:</b> Calculated based on FastLED hardware timing limits.</p>
                `
            },
            {
                id: 5,
                title: "5. Smart Wiring Guide & Pin Allocations",
                duration: "00:25",
                desc: "Understanding pin highlights, pin allocation table, and instructions.",
                script: "The Smart Wiring Guide section features a visual ESP32 pinout board with glowing green active data pins and yellow ground pins. It generates a Pin Allocation Table showing exactly which GPIO connects to which strip range, plus mandatory common ground instructions.",
                visual: `
                    <p><b>Wiring Rules:</b></p>
                    <p>• <b>Pin D2:</b> Data In for Strip Segment 1</p>
                    <p>• <b>Pin D4, D5, D12:</b> Data In for parallel segments</p>
                    <p>• <b>Common Ground:</b> Connect ESP32 GND to 5V Supply (-) & Matrix GND.</p>
                `
            },
            {
                id: 6,
                title: "6. Uploading .bin Animation Files",
                duration: "00:15",
                desc: "Uploading binary animation files for instant playback.",
                script: "Finally, drag and drop your .bin animation file into the upload zone. The progress bar will track the upload chunks. Once finished, the ESP32 automatically saves it to LittleFS flash and begins playing the animation seamlessly!",
                visual: `
                    <div style="text-align:center; padding:15px; border:2px dashed var(--accent-cyan); border-radius:8px;">
                        <h4 style="color:var(--accent-green);">📁 Drag & Drop .bin File Here</h4>
                        <p style="font-size:0.8rem; margin-top:4px;">Supports large animation files (e.g. 500 LEDs @ 30 FPS)</p>
                    </div>
                `
            }
        ];

        let currentSceneIndex = 0;
        let isPlaying = false;
        let playInterval = null;

        const viewport = document.getElementById('viewport');
        const sceneBadge = document.getElementById('sceneBadge');
        const sceneTitle = document.getElementById('sceneTitle');
        const sceneDesc = document.getElementById('sceneDesc');
        const sceneVisual = document.getElementById('sceneVisual');
        const narratorScript = document.getElementById('narratorScript');
        const progressFill = document.getElementById('progressFill');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const sceneList = document.getElementById('sceneList');
        const timerDisplay = document.getElementById('timerDisplay');

        function renderSceneList() {
            sceneList.innerHTML = '';
            scenes.forEach((sc, idx) => {
                const item = document.createElement('div');
                item.className = `scene-item ${idx === currentSceneIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="scene-item-title">${sc.title}</div>
                    <div class="scene-item-duration">Duration: ${sc.duration}</div>
                `;
                item.onclick = () => loadScene(idx);
                sceneList.appendChild(item);
            });
        }

        function loadScene(index) {
            currentSceneIndex = index;
            const sc = scenes[index];
            sceneBadge.textContent = `Scene ${sc.id} / ${scenes.length}`;
            sceneTitle.textContent = sc.title;
            sceneDesc.textContent = sc.desc;
            sceneVisual.innerHTML = sc.visual;
            narratorScript.textContent = sc.script;

            const percent = ((index + 1) / scenes.length) * 100;
            progressFill.style.width = percent + '%';
            timerDisplay.textContent = `Scene ${index + 1} of ${scenes.length}`;

            renderSceneList();
        }

        function playNext() {
            if (currentSceneIndex < scenes.length - 1) {
                loadScene(currentSceneIndex + 1);
            } else {
                stopPlayback();
                loadScene(0);
            }
        }

        function startPlayback() {
            isPlaying = true;
            playBtn.textContent = "Pause Presentation";
            playInterval = setInterval(playNext, 6000);
        }

        function stopPlayback() {
            isPlaying = false;
            playBtn.textContent = "Play Presentation";
            if (playInterval) clearInterval(playInterval);
        }

        playBtn.onclick = () => {
            if (isPlaying) stopPlayback();
            else startPlayback();
        };

        prevBtn.onclick = () => {
            stopPlayback();
            if (currentSceneIndex > 0) loadScene(currentSceneIndex - 1);
        };

        nextBtn.onclick = () => {
            stopPlayback();
            if (currentSceneIndex < scenes.length - 1) loadScene(currentSceneIndex + 1);
        };

        loadScene(0);
    </script>
</body>
</html>
